databases:
  - name: globetrotter-db
    databaseName: globetrotter
    user: globetrotter
    plan: free

services:
  # ── GlobeTrotter Backend (Express REST API) ─────────────────
  - type: web
    name: globetrotter-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: globetrotter-db
          property: connectionString

  # ── GlobeTrotter Frontend (Vite + React SPA) ───────────────
  - type: web
    name: globetrotter-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: globetrotter-api
          property: host
